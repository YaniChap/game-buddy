
[plugin]
min_astra_version = "0.2.7"
id = "game-buddy"
name = "GameBuddy"
version = "0.2.0"
description = "A customizable AI gaming companion with Steam tracking, personality controls, session insights, and a neon interface."
author = "YaniChap"
license = "MIT"

[entry]
command = "target/release/game_buddy"

[capabilities]
tools = true
event_handlers = true
client = true
ui_contributions = true

[permissions]
subscribe_events = { types = ["games_changed", "companion_game_changed"], reason = "Tracks game list and selected game changes to detect active gaming sessions." }
send_chat_message = { reason = "Sends game start messages and session summaries to the GameBuddy chat." }
push_to_ui = { reason = "Updates the GameBuddy interface with game activity and session status." }

[config]
schema = '''
{
  "type": "object",
  "properties": {}
}
'''
