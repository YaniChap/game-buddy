<!doctype html>
<html lang="ru">
<head>
  <script src="http://astra-plugin.localhost/bridge/astra-bridge.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080711">
  <title>GameBuddy — Astra Gaming Companion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #080711; color: #f5f0ff; font-family: "Segoe UI", Arial, sans-serif; }
    body { background: radial-gradient(ellipse at 12% 5%, rgba(129,55,225,.19), transparent 42%), radial-gradient(ellipse at 92% 75%, rgba(71,34,125,.13), transparent 46%), #080711; }
    #app { min-height: 100vh; }
    ::selection { background: #8b5cf6; color: white; }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #b78aff; outline-offset: 2px; }
    button:disabled { opacity: .6; cursor: wait !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
